name: Build docker image

on:
  push:
    branches:
    - master

    tags:
    - '*'
    - '!*-r[0-9]*'

jobs:
  apache-24:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check scanned-image publication
      run: python3 tests/scanned-image-release.py
    - uses: docker/setup-qemu-action@v4
      with:
        platforms: amd64,arm64
    - uses: docker/setup-buildx-action@v4
    - uses: ./.github/actions
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      with:
        version: '2.4.68'
        tags: 2.4,2,latest
        platform: linux/amd64,linux/arm64

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ apache-24 ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@6866a90de9b5966fa6aab7a224d7c7b82103f5bd
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
