name: Build
description: Build apache image
inputs:
  version:
    description: version
    required: true
  tags:
    description: image tags
    required: true
  platform:
    description: docker platform
    required: false
    default: linux/amd64
runs:
  using: composite
  steps:
    - name: Validate scan platforms
      shell: bash
      env:
        PLATFORMS: ${{ inputs.platform }}
      run: |
        test -n "$PLATFORMS"
        IFS=',' read -ra platforms <<< "$PLATFORMS"
        for platform in "${platforms[@]}"; do
          case "$platform" in
            linux/amd64|linux/arm64) ;;
            *) echo "Unsupported scan platform: $platform" >&2; exit 1 ;;
          esac
        done
    - name: Build amd64 image
      id: build-amd64
      if: contains(inputs.platform, 'linux/amd64')
      shell: bash
      env:
        APACHE_VER: ${{ inputs.version }}
        PLATFORM: linux/amd64
        TAG: scan-amd64
      run: |
        make buildx-load
        make test
        image=$(make --no-print-directory -s image-ref)
        echo "image=$(docker image inspect --format '{{.Id}}' "$image")" >> "$GITHUB_OUTPUT"
    - name: Scan amd64 image
      if: contains(inputs.platform, 'linux/amd64')
      uses: ./.github/actions/grype
      with:
        image: docker:${{ steps.build-amd64.outputs.image }}
        platform: linux/amd64
    - name: Build arm64 image
      id: build-arm64
      if: contains(inputs.platform, 'linux/arm64')
      shell: bash
      env:
        APACHE_VER: ${{ inputs.version }}
        PLATFORM: linux/arm64
        TAG: scan-arm64
      run: |
        make buildx-load
        image=$(make --no-print-directory -s image-ref)
        echo "image=$(docker image inspect --format '{{.Id}}' "$image")" >> "$GITHUB_OUTPUT"
    - name: Scan arm64 image
      if: contains(inputs.platform, 'linux/arm64')
      uses: ./.github/actions/grype
      with:
        image: docker:${{ steps.build-arm64.outputs.image }}
        platform: linux/arm64
    - name: Publish scanned images
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
        PLATFORM: ${{ inputs.platform }}
        SCANNED_IMAGE_AMD64: ${{ steps.build-amd64.outputs.image }}
        SCANNED_IMAGE_ARM64: ${{ steps.build-arm64.outputs.image }}
      run: bash "$GITHUB_ACTION_PATH/release.sh"
